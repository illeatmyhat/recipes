# data/ingredients/<id>.yaml — the LOCALE-NEUTRAL core, one file per ingredient.
# Create this ONLY when the ingredient does not already exist in data/ingredients/.
# `id` must equal the filename (<id>.yaml) and every ref id that points to it.
#
# The core is a library asset: nothing locale- or culture-specific belongs in
# it — no names, no aliases, no aisles, no buying notes. ALL of that lives in
# one companion file PER SUPPORTED LOCALE (see the bottom of this template);
# the build fails if any locale's file is missing.
id: <id>
# USDA FoodData Central id. MUST be an SR Legacy entry — get it (and the
# per_100g block below) from scripts/fetch-usda.mjs.
fdc_id: 0
# Paste the next two keys verbatim from: node scripts/fetch-usda.mjs <fdcId>
nutrition:
  per_100g:
    calories: 0
    fat: 0
    saturated_fat: 0
    trans_fat: 0
    cholesterol: 0
    sodium: 0
    carbohydrates: 0
    fiber: 0
    sugars: 0
    protein: 0
    calcium: 0
    iron: 0
# Grams per millilitre. REQUIRED (non-null) if any recipe uses this ingredient
# with unit `ml`; otherwise null. See reference/units.md for common values.
density_g_per_ml: null
# ── REQUIRED COMPANIONS — data/ingredients/<locale>/<id>.yaml, one per
# supported locale (en-US, ja-JP, zh-CN — see site.config.ts), each written
# in ITS OWN language for ITS OWN market. The shape (everything below is for
# that one locale, so nothing is keyed by locale):
#
#   # <locale> ingredient data for data/ingredients/<id>.yaml — locale-specific fields only.
#   names: <display name>
#   aliases:                       # other names the transcript / shoppers might use
#     - <alias>
#   aisle: <section id>            # that market's OWN store geography — they differ
#                                  # (tofu: dairy_eggs in the US, tofu_soy in JP/CN;
#                                  # soy sauce: international in the US, condiments in
#                                  # JP/CN). Valid ids (StoreSection, src/lib/types.ts):
#                                  # produce, meat_seafood, tofu_soy, dairy_eggs,
#                                  # dry_goods, canned, condiments, spices, oils,
#                                  # international, other.
#   availability:                  # OPTIONAL market guidance — original content for
#     notes:                       # this market, never a translation of another
#       - <plain shopping note>    # locale's note. Omit when nothing useful to say.
#       - text: <warning>          # `important: true` ONLY for what every cook needs
#         important: true          # before shopping: wrong-form-breaks-the-recipe
#                                  # (rolled vs quick oats) or scarce in this market
#     brands:                      # ONLY when the form is easy to get wrong —
#       - <brand>                  # don't invent brand names; omit over [].
