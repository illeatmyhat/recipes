# src/content/recipes/<slug>.ja.yaml — JA catalog for <slug>.mdx. Flat map of
# dotted paths into the canonical EN frontmatter/body; merged at build by
# src/lib/v3/i18n.ts. EVERY localizable key authored in the MDX needs an entry
# here — a recipe declaring ja with a missing key FAILS THE BUILD.
#
# After writing or updating this file, refresh the staleness sidecar:
#   PowerShell: $env:REFRESH_CATALOG_HASHES='1'; npm run build
#   bash:       REFRESH_CATALOG_HASHES=1 npm run build
# (<slug>.ja.hashes.yaml is machine-written — commit it, never edit it.)
title: <日本語タイトル>
customize_title: <カスタマイズ見出し>
pattern: >-
  <パターン（このレシピの「なぜ成り立つか」）の自然な日本語訳。>

knobs.<knob_id>.label: <ラベル>
knobs.<knob_id>.why: <理由>
knobs.<knob_id>.optionLabels.<value_a>: <選択肢A>
knobs.<knob_id>.optionLabels.<value_b>: <選択肢B>

constraints.0.error: <エラーメッセージ>
constraints.1.warn: <注意メッセージ>

roles.<role_id>.label: <役割ラベル>
roles.<role_id>.why: <役割の理由 — パターンから導かれる「仕事」>
roles.<role_id>.fills.<fill_id>.note: <このレシピでの扱い方>
roles.<role_id>.fills.<fill_id>.why: <この食材を選ぶときに知っておくこと>
# EN側で alias を書いた fill には必ず JA alias も（裸の名詞句、助詞なし）:
roles.<role_id>.fills.<fill_id>.alias: <文中で使う名前>

# Method steps — templates for the MDX body's <Step id> elements. `{role}`
# renders the role's chosen fills as a list join; `{role:fill}` names one
# fill. Place each read where Japanese grammar wants it; dropping a read the
# EN sentence has is fine (parity lint warns for review, never blocks).
# Placeholders must be EXACTLY {role} or {role:fill} — anything else fails
# the build.
steps.<step_id>.title: <手順名>
steps.<step_id>: "{<role_id>}を…する。<手順の説明>"
steps.<guarded_step>.title: <手順名>
steps.<guarded_step>: "{<role>:<fill>}は…。<このfill特有の理由>"
