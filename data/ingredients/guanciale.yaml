# the conservative side for the nutrient that matters in a cured meat
# (sodium 2684 vs guanciale's typical ~1600 mg/100g; fat 80% vs ~70%). The
# alternative, fresh uncured jowl (168269), nails the macros but reports
# sodium 25 mg -- a ~98% lie. Salty-side honesty wins.
