# JA catalog for weight-loss-stew. Canonical EN lives in weight-loss-stew.mdx;
# keys are dotted paths into its frontmatter. Merged at build by src/lib/v3/i18n.ts.
title: 満腹ダイエットシチュー
customize_title: 鍋をカスタマイズ
pattern: >-
  高ボリューム・高食物繊維・十分なタンパク質・低カロリー密度。胃はカロリーではなく
  「量」を感じ取る。この大きさの液体ベースの食事は何時間も満腹感を保つ。聖域となる
  食材はなく、すべての役割がこの目的のためにある。目的さえ保てば、入れ替えても
  料理の本質は変わらない。

knobs.thickness.label: とろみ
knobs.thickness.why: とろみの素はレンズ豆なので、レンズ豆だけを増減する。濃くするほど1杯あたりのタンパク質と食物繊維も増える。
knobs.blend.label: ブレンドでクリーミーに
knobs.blend.why: 鍋の一部をピューレにすると、クリームなしでクリーミーなスープになる。オンにすると作り方に1ステップ増える。

constraints.0.error: 塩気の素を最低ひとつ残すこと。塩もしょうゆもないと本当に味がつかず、スパイスでは補えない。
constraints.1.warn: 油なしの蒸し炒めでも作れる。焦げつきやすいので、鍋から目を離さず水を少しずつ足しながら。

roles.added_fat.label: 油
roles.added_fat.why: 鍋全体の油は大さじ1だけ。香りではなく風味の媒体（揮発成分は煮込みで飛ぶ）。省略可能で、水で炒めてもよい。
roles.added_fat.fills.olive_oil.note: 大さじ1。鍋に加える油はこれだけ。

roles.aromatics.label: 香味野菜
roles.aromatics.why: ほぼゼロカロリーの野菜で作る風味の土台。カロリー密度を上げずにコクを出す。
roles.aromatics.fills.onion.note: 大きめの玉ねぎ約1個を大きく刻む。
roles.aromatics.fills.garlic.note: にんにく約4片を大きめに。

roles.lentils.label: レンズ豆
roles.lentils.why: 屋台骨。タンパク質・食物繊維・鉄分を加え、煮汁にとろみをつける。両方をこなすのはこれだけで、代替はない。
roles.lentils.fills.lentils.note: 乾燥で約½カップ。ブラウンまたはグリーンは煮崩れしにくい。
roles.lentils.fills.lentils.alias: レンズ豆

roles.protein.label: タンパク質
roles.protein.why: 満腹感にはタンパク質が必要。ただしパターン上は低脂肪であること。脂の多い部位はカロリー計算を崩す。
roles.protein.fills.tofu.note: 1丁。水切りのみでよく、押す必要はない。崩しながら加える。

roles.potato.label: じゃがいも
roles.potato.why: 満腹感の主役。安価でかさのある食材。翌日温め直すとレジスタントスターチができ、さらに良い。
roles.potato.fills.potato.note: 鍋のかさの中心。食べごたえが出るよう大きめに切る。
roles.potato.fills.potato.alias: じゃがいも

roles.vegetables.label: 野菜
roles.vegetables.why: ほぼゼロカロリーでかさと食物繊維を稼ぐ。高ボリュームの要。
roles.vegetables.fills.carrots.note: にんじん2〜3本を大きめに切る。
roles.vegetables.fills.celery.note: 約4本。旨味の土台。
roles.vegetables.fills.mushrooms.note: 約230g。さっと洗うだけでよい。
roles.vegetables.fills.diced_tomatoes.note: 1缶を汁ごと。とろみとほどよい酸味。
roles.vegetables.fills.diced_tomatoes.alias: ダイストマト

roles.greens.label: 青菜
roles.greens.why: ほぼゼロカロリーでかさと微量栄養素を加える。最後に入れて食感を残す。
roles.greens.fills.spinach.note: 約2カップ。火を止めてすぐしんなりする。

roles.seasonings.label: 調味料
roles.seasonings.why: ほぼゼロカロリーで旨味と温かみを出す。ダイエット食らしくない味の理由。
roles.seasonings.fills.soy_sauce.note: 大さじ約2。約20kcalで煮込んだ旨味。減塩で塩分を自分で調整。
roles.seasonings.fills.cumin.note: 小さじ約1。温かく土っぽいベース。
roles.seasonings.fills.smoked_paprika.note: 小さじ約1。肉なしでスモーキーなコク。
roles.seasonings.fills.salt.note: 最後にしょうゆの後で味を見て調整。
roles.seasonings.fills.salt.alias: 塩
roles.seasonings.fills.black_pepper.note: 他の調味料と一緒に数回挽き入れる。

roles.extras.label: お好みで
roles.extras.why: お好みの引き締め役。パターンには必須ではない。
roles.extras.fills.ginger.note: 少量のジンジャーパウダーが全体を引き締める。

# Method steps — templates for the MDX body's <Step id> elements. `{role}`
# renders the role's chosen fills as a list join; `{role:fill}` names one fill.
steps.prep_aromatics.title: 香味野菜を準備
steps.prep_aromatics: "{aromatics}を大きめに刻む。ごろっとしたシチューなので、すべて食べごたえのある大きさに。"
steps.start_base_oil.title: ベースを作る
steps.start_base_oil: "ダッチオーブンを中火で熱し、{added_fat}を入れる（鍋全体で使う油はこれだけ）。{aromatics}を加えてしんなりさせる。"
steps.start_base_dry.title: ベースを作る
steps.start_base_dry: "ダッチオーブンを中火で熱し、{aromatics}を少量の水で蒸し炒めにする。焦げつきそうになったら水を少し足す。"
steps.add_lentils.title: レンズ豆を加える
steps.add_lentils: "{lentils}を洗って加える。煮込むうちに煮汁にとろみがつく。"
steps.add_protein.title: タンパク質を加える
steps.add_protein: "{protein:tofu}は水気を切り（押す必要はない）、大きく崩しながら鍋に入れる。"
steps.season.title: 味付け
steps.season: "{seasonings}を加えて数分煮て、香りを立たせる。"
steps.soy_umami.title: 旨味の近道
steps.soy_umami: "{seasonings:soy_sauce}が時間の代わりを務める。数分の煮込みで、長時間煮込んだような旨味になる。"
steps.add_ginger.title: 香りづけ
steps.add_ginger: "{extras:ginger}をひとさじ加えると、鍋全体の味が引き締まる。"
steps.rinse_mushrooms.title: マッシュルームの下準備
steps.rinse_mushrooms: "{vegetables:mushrooms}はさっと洗うだけでよい。こすったり皮をむいたりは不要。"
steps.add_vegetables.title: 野菜を加える
steps.add_vegetables: "{potato}と{vegetables}を加える。包丁を使うものはすべて大きめに切る。大きめの具材がこのシチューの持ち味。少しの間煮詰める。"
steps.tomato_juice.title: トマトは汁ごと
steps.tomato_juice: "{vegetables:diced_tomatoes}は汁ごと入れる。この汁がスープの土台になる。"
steps.simmer.title: 煮込む
steps.simmer: "材料の上ぎりぎりまで水を注ぐ。蓋をして弱火にし、{lentils}が柔らかく煮汁がとろりとするまで25〜30分煮込む。"
steps.blend_half.title: ブレンドでクリーミーに
steps.blend_half: "鍋の約3分の1をブレンダーにかけ（スティックブレンダーで鍋の中で直接でも）、ピューレにして鍋に戻す。クリームなしでクリーミーなスープに。"
steps.finish_greens.title: 青菜で仕上げ
steps.finish_greens: "火を止めて{greens}を加え、しんなりさせる。大きなボウルによそう。1人前でもたっぷりの満足ボリューム。"
